[workspace]
members = ["api", "client", "server"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"

[workspace.dependencies]
hub-api = { path = "api" }
weave = { git = "https://github.com/shuyra-arche/weave.git", rev = "7a7d67fb3f190aeb43049d051b0972bcd53213bc" }
twine = { git = "https://github.com/shuyra-arche/twine.git", rev = "8c68cbeffd024b4105a6a7c2f4baaab330994ca1" }
kernel-api = { git = "https://github.com/shuyra-arche/kernel.git", rev = "684f479c45dc2d94d405b32b4ffc6334a4233fc9" }
kernel-client = { git = "https://github.com/shuyra-arche/kernel.git", rev = "684f479c45dc2d94d405b32b4ffc6334a4233fc9" }
system-api = { git = "https://github.com/shuyra-arche/system.git", rev = "f97524817ce240a0b0471be3b557ceb5a871fe14" }
system-client = { git = "https://github.com/shuyra-arche/system.git", rev = "f97524817ce240a0b0471be3b557ceb5a871fe14" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
