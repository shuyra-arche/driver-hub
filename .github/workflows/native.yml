name: Native Hub

# Ordinary CI runs one Hart. Multi-Hart qualification is opt-in outside
# required CI; performance comparisons may explicitly select four Harts.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_handoff: ${{ steps.classify.outputs.run_handoff }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
      - name: Verify pull request path classifier
        if: github.event_name == 'pull_request'
        run: PYTHONDONTWRITEBYTECODE=1 python3 tests/ci/test_selection.py
      - name: Classify pull request changes
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$EVENT_NAME" != pull_request ]]; then
            echo 'run_handoff=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git fetch --no-tags --depth=1 origin "$BASE_SHA"; then
            echo 'Could not fetch PR base; running handoff.'
            echo 'run_handoff=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git diff --no-renames -z --name-only "$BASE_SHA" HEAD > "$RUNNER_TEMP/changed-paths"; then
            echo 'Could not classify PR diff; running handoff.'
            echo 'run_handoff=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 tests/ci/selection.py < "$RUNNER_TEMP/changed-paths" >> "$GITHUB_OUTPUT"

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install declared toolchain
        run: rustup toolchain install nightly-2026-11-13 --profile minimal --component rust-src --component rustfmt --component clippy --target riscv64gc-unknown-none-elf
      - name: Verify formatting, Host contracts and warnings
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 tests/ci/test_selection.py
          cargo fmt --all -- --check
          cargo test --workspace --locked --target x86_64-unknown-linux-gnu
          cargo clippy --workspace --all-targets --locked --target x86_64-unknown-linux-gnu -- -D warnings
      - name: Verify dependency identity
        run: |
          cargo metadata --locked --format-version 1 > "$RUNNER_TEMP/hub-metadata.json"
          cargo tree --workspace --locked --edges normal,build --target riscv64gc-unknown-none-elf
          python3 - <<'PY'
          import json, os, pathlib, tomllib
          packages = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'hub-metadata.json').read_text())['packages']
          dependencies = tomllib.loads(pathlib.Path('Cargo.toml').read_text())['workspace']['dependencies']
          revision = dependencies['kernel-api']['rev']
          assert len(revision) == 40 and all(c in '0123456789abcdef' for c in revision)
          expected = f'git+https://github.com/shuyra-arche/kernel.git?rev={revision}#{revision}'
          providers = [p for p in packages if p['name'] in {'kernel-api', 'kernel-client', 'kernel-api-macros'}]
          assert len(providers) == 3 and {p['source'] for p in providers} == {expected}
          system = [p for p in packages if p['name'] in {'system-api', 'system-client'}]
          system_revision = '332d9d2e15f6bc4e1e8d94e4db2591b1a53ae613'
          assert len(system) == 2 and {p['source'] for p in system} == {f'git+https://github.com/shuyra-arche/system.git?rev={system_revision}#{system_revision}'}
          twine = [p for p in packages if p['name'] == 'twine']
          twine_revision = '932454c07bd2673ac7d6d9612d36182aae71e8b2'
          assert len(twine) == 1 and twine[0]['source'] == f'git+https://github.com/shuyra-arche/twine.git?rev={twine_revision}#{twine_revision}'
          legacy = {'env', 'wire', 'mold', 'ipc', 'resource', 'execution', 'router-api', 'driver-support'}
          assert not {p['name'] for p in packages} & legacy
          assert all(p['source'] is None for p in packages if p['name'].startswith('hub-'))
          print('PASS one immutable Kernel identity; no legacy dependencies or Hub self Git pins')
          PY
      - name: Build RV64 libraries in debug and release
        env:
          CARGO_TARGET_RISCV64GC_UNKNOWN_NONE_ELF_RUSTFLAGS: -Crelocation-model=static -Cforce-frame-pointers=yes -Ccode-model=medium -Dwarnings
        run: |
          cargo build --workspace --locked --target riscv64gc-unknown-none-elf
          cargo build --workspace --locked --release --target riscv64gc-unknown-none-elf

  handoff:
    needs: changes
    if: always() && !cancelled() && (needs.changes.outputs.run_handoff != 'false' || needs.changes.result != 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: debian:trixie-slim@sha256:a72b4433de1cf7d6bae0c4cee74d0547f58601a643b3375f070c51600d63b6b2
    strategy:
      fail-fast: false
      matrix:
        profile: [debug, release]
    env:
      QEMU_RISCV64: qemu-system-riscv64
      QEMU_OPENSBI: /usr/lib/riscv64-linux-gnu/opensbi/generic/fw_dynamic.bin
      RUSTFLAGS: -Crelocation-model=static -Cforce-frame-pointers=yes -Ccode-model=medium -Dwarnings
    steps:
      - name: Install build tools and QEMU
        run: |
          apt-get update
          apt-get install --no-install-recommends -y ca-certificates curl gcc git libc6-dev opensbi python3 qemu-system-misc
          qemu-system-riscv64 --version
          sha256sum "$QEMU_OPENSBI"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install declared toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup-init.sh
          sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" show
      - name: Fetch pinned System fixture and hash platform lock
        id: platform_lock
        run: |
          git clone https://github.com/shuyra-arche/system.git "$RUNNER_TEMP/system"
          git -C "$RUNNER_TEMP/system" checkout --detach 332d9d2e15f6bc4e1e8d94e4db2591b1a53ae613
          echo "sha256=$(sha256sum "$RUNNER_TEMP/system/tests/guest/runtime/platform/Cargo.lock" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Restore pinned Cargo downloads
        id: cargo_cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/registry/src
            ~/.cargo/git/db
            ~/.cargo/git/checkouts
          key: cargo-${{ runner.os }}-${{ runner.arch }}-nightly-2026-11-13-${{ matrix.profile }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'tests/target/handoff/Cargo.lock') }}-${{ steps.platform_lock.outputs.sha256 }}-${{ hashFiles('.github/workflows/native.yml') }}
      - name: Report Cargo download cache
        env:
          CACHE_HIT: ${{ steps.cargo_cache.outputs.cache-hit }}
        run: |
          echo "Cargo download cache hit=${CACHE_HIT:-false}"
      - name: Restore fixed System platform build target
        id: platform_cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/platform
          key: platform-${{ runner.os }}-${{ runner.arch }}-nightly-2026-11-13-release-riscv64gc-unknown-none-elf-332d9d2e15f6bc4e1e8d94e4db2591b1a53ae613-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'tests/target/handoff/Cargo.lock') }}-${{ steps.platform_lock.outputs.sha256 }}-${{ hashFiles('.github/workflows/native.yml') }}
      - name: Report fixed platform build cache
        env:
          CACHE_HIT: ${{ steps.platform_cache.outputs.cache-hit }}
        run: |
          echo "Fixed System platform build cache hit=${CACHE_HIT:-false}"
      - name: Build the fixed instruction-qualified platform
        run: |
          cargo build --locked --manifest-path "$RUNNER_TEMP/system/tests/guest/runtime/platform/Cargo.toml" --features instructions --target-dir "$RUNNER_TEMP/platform" --release --target riscv64gc-unknown-none-elf
      - name: Save fixed System platform build target
        if: matrix.profile == 'release' && steps.platform_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/platform
          key: platform-${{ runner.os }}-${{ runner.arch }}-nightly-2026-11-13-release-riscv64gc-unknown-none-elf-332d9d2e15f6bc4e1e8d94e4db2591b1a53ae613-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'tests/target/handoff/Cargo.lock') }}-${{ steps.platform_lock.outputs.sha256 }}-${{ hashFiles('.github/workflows/native.yml') }}
      - name: Run the real Hub Instance consumer on one Hart
        run: python3 tests/target/handoff/run.py "$RUNNER_TEMP/platform/riscv64gc-unknown-none-elf/release/system-runtime-platform" --system-checkout "$RUNNER_TEMP/system" --profile ${{ matrix.profile }} --harts 1
      - name: Preserve native consumer evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hub-handoff-${{ matrix.profile }}-attempt-${{ github.run_attempt }}
          path: |
            tests/target/handoff/target/inputs.json
            tests/target/handoff/target/system-*/tests/guest/system/target/handoff/
          if-no-files-found: error
